openapi: 3.1.0
info:
  version: 3.0.0
  title: Platform Server Accounts Assets API
  description: 'The platform server is an internal component. It should be hosted in a private network and should not be accessible from the Internet. This server enables the business to fetch and update the state of transactions using its API.

    '
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: https://platform-server.exampleanchor.com
tags:
- name: Assets
  description: Assets are representations of value issued on the Stellar network. An asset consists of a type, code, and issuer.
paths:
  /assets:
    get:
      tags:
      - Assets
      summary: List all Assets
      description: This endpoint lists all assets.
      operationId: ListAllAssets
      parameters:
      - $ref: '#/components/parameters/AssetCodeParam'
      - $ref: '#/components/parameters/AssetIssuerParam'
      - $ref: '#/components/parameters/CursorParam'
      - $ref: '#/components/parameters/OrderParam'
      - $ref: '#/components/parameters/LimitParam'
      x-supports-streaming: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Links'
                - $ref: '#/components/schemas/Asset'
              examples:
                ListAllAssets:
                  $ref: '#/components/examples/ListAllAssets'
components:
  examples:
    ListAllAssets:
      value:
        _links:
          self:
            href: https://horizon-testnet.stellar.org/assets?asset_code=CNY&cursor=&limit=3&order=asc
          next:
