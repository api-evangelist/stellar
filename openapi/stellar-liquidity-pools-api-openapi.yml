        paging_token:
          $ref: '#/components/schemas/paging_token'
        fee_bp:
          type: integer
          format: uint32
        type:
          type: string
        total_trustlines:
          type: string
        total_shares:
          type: string
        reserves:
          type: object
          properties:
            asset:
              type: string
            amount:
              type: string
        last_modified_ledger:
          type: string
        last_modified_time:
          type: string
