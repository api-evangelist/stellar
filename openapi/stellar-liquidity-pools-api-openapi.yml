      - id
      - paging_token
      - fee_bp
      - type
      - total_trustlines
      - total_shares
      - reserves
      - last_modified_ledger
      - last_modified_time
    address:
      type: string
      pattern: G[A-Z0-9]{55}
    TransactionPreconditions:
      type: object
      properties:
