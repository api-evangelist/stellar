openapi: 3.1.0
info:
  version: 3.0.0
  title: Platform Server Accounts Customers API
  description: 'The platform server is an internal component. It should be hosted in a private network and should not be accessible from the Internet. This server enables the business to fetch and update the state of transactions using its API.

    '
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: https://platform-server.exampleanchor.com
tags:
- name: Customers
  description: '[SEP-12](https://github.com/stellar/stellar-protocol/blob/master/ecosystem/sep-0012.md) requests made from client

    applications.

    '
paths:
  /customer:
    get:
      description: "The request and response for this endpoint is identical to the\n[`GET /customer`](https://github.com/stellar/stellar-protocol/blob/master/ecosystem/sep-0012.md#customer-get)\nrequest and response defined in SEP-12.\n\nThis endpoint allows clients to:\n\n  1. Fetch the fields the server requires in order to register a new customer via a SEP-12\n[`PUT /customer`](https://github.com/stellar/stellar-protocol/blob/master/ecosystem/sep-0012.md#customer-put) request\n\nIf the server does not have a customer registered for the parameters sent in the request, it should return the\nfields required in the response. The same response should be returned when no parameters are sent.\n\n  2. Check the status of a customer that may already be registered\n\nThis allows clients to check whether the customers information was accepted, rejected, or still needs more info.\nIf the server still needs more info, or the server needs updated information, it should return the fields required.\n"
      tags:
      - Customers
      x-seps:
      - SEP-6
      - SEP-12
      - SEP-31
      summary: Retrieve Customer's Info
      operationId: getCustomer
      parameters:
      - in: query
        name: id
        description: The ID of the customer as returned in the response of a previous PUT request.
        schema:
          type: string
      - in: query
        name: account
        description: The Stellar or Muxed Account authenticated with the Platform via SEP-10.
        schema:
          type: string
      - in: query
        name: memo
        description: The memo value identifying a customer with a shared account, where the shared account is `account`.
        schema:
          type: string
      - in: query
        name: memo_type
        description: The type of memo used to identify a customer with a shared account.
        schema:
          type: string
          enum:
          - id
          - hash
          - text
      - in: query
        name: type
        description: 'The type of action the customer is being KYCd for. See the

          [Type Specification](https://github.com/stellar/stellar-protocol/blob/master/ecosystem/sep-0012.md#type-specification)

          documented in SEP-12.

          '
        schema:
          type: string
      - in: query
        name: transaction_id
        description: 'The transaction id with which the customer''s info is associated. When information from the customer depends on the

          transaction (e.g., more information is required for larger amounts)

          '
        schema:
          type: string
      - in: query
        name: lang
        description: 'Defaults to `en`. Language code specified using ISO 639-1. Human readable descriptions, choices, and

          messages should be in this language.

          '
        schema:
          type: string
      responses:
        '200':
          description: 'Valid request. Customer either already exists or the customer identified by the parameters is new and must

            provide the field values described in the response body. Response bodies are identical to the schema defined

            in [SEP-12](https://github.com/stellar/stellar-protocol/blob/master/ecosystem/sep-0012.md#customer-get).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCustomerResponse'
              examples:
                SuccessKYC:
                  $ref: '#/components/examples/SuccessKYC'
        '400':
          description: Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
      - Customers
      x-seps:
      - SEP-6
      - SEP-12
      - SEP-24
      - SEP-31
      description: '**The Anchor Platform does not persist any customer KYC data.**


        The request and response for this endpoint are identical to the

        [`PUT /customer`](https://github.com/stellar/stellar-protocol/blob/master/ecosystem/sep-0012.md#customer-put)

        request and response defined in SEP-12.


        Client applications make requests with the following request body, which is forwarded to the anchor. Anchors

        must validate and persist the data passed, and return the customer''s `id`. Requests containing only string fields will

        be forwarded to the anchor as with the `application/json` content type. Requests containing

        binary fields will be forwarded to the anchor as with the `multipart/form-data` content type.

        '
      summary: Create or Update Customer Info
      operationId: putCustomer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutCustomerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PutCustomerMultipartRequest'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCustomerResponse'
        '400':
          description: Invalid data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /customer/{id}:
    delete:
      tags:
      - Customers
      x-seps:
      - SEP-12
      - SEP-31
      description: 'The request for this endpoint is identical to the

        [`DELETE /customer`](https://github.com/stellar/stellar-protocol/blob/master/ecosystem/sep-0012.md#customer-delete)

        request defined in SEP-12.


        Delete the customer''s data or queue the customers data for deletion.

        '
      summary: Delete Customer Data
      operationId: delCustomer
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      responses:
        '204':
          description: Success.
        '404':
          description: Customer not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
