          - PROCESSING
          - NEEDS_INFO
          - REJECTED
        fields:
          type: object
          additionalProperties:
            required:
            - type
            - description
            properties:
              type:
                type: string
                enum:
                - string
                - binary
                - number
                - date
              description:
                type: string
              choices:
                type: array
                items:
                  type: string
              optional:
                type: boolean
        provided_fields:
          type: object
          additionalProperties:
            required:
            - type
            - description
            properties:
              type:
                type: string
                enum:
                - string
                - binary
                - number
                - date
